    <script>
      
    // Chromakey shader component (YCbCr + Weiche Kanten + Despill)
(function(){
  if (!window.AFRAME) { console.warn('AFRAME not found when defining chromakey component'); return; }
  try {
    AFRAME.registerComponent('chromakey', {
      schema: {
        color: { type: 'color', default: '#00FF00' },
        threshold: { type: 'number', default: 0.35 }, // Standardwert erhöht für besseres Keying
        softness: { type: 'number', default: 0.10 },  // Erlaubt weichen Übergang statt hartem Cut
        spillSuppress: { type: 'number', default: 0.70 },
        edgeCrop: { type: 'number', default: 0.01 }   // Minimaler Randabschnitt
      },
      init: function(){
        const el = this.el; const data = this.data;

        const attach = () => {
          let videoEl = data.videoSelector;
          if (!videoEl) {
            const srcAttr = el.getAttribute('src');
            if (srcAttr && typeof srcAttr === 'string' && srcAttr.startsWith('#')) videoEl = document.querySelector(srcAttr);
          }
          if (!videoEl) return;
          if (!window.THREE) { setTimeout(attach,200); return; }

          const videoTexture = new THREE.VideoTexture(videoEl);
          videoTexture.minFilter = THREE.LinearFilter; 
          videoTexture.magFilter = THREE.LinearFilter; 
          // WICHTIG: RGBA Format erlauben
          videoTexture.format = THREE.RGBAFormat;

          const mesh = el.getObject3D('mesh'); if (!mesh) { setTimeout(attach,200); return; }

          const fragment = `
            precision mediump float; 
            varying vec2 vUv; 
            uniform sampler2D texture1; 
            uniform vec3 keyColor; 
            uniform float threshold; 
            uniform float softness; 
            uniform float spillSuppress; 
            uniform float edgeCrop;

            vec3 rgb2ycbcr(vec3 c) {
              float y  =  0.299*c.r + 0.587*c.g + 0.114*c.b;
              float cb = -0.168736*c.r - 0.331264*c.g + 0.5*c.b + 0.5;
              float cr =  0.5*c.r - 0.418688*c.g - 0.081312*c.b + 0.5;
              return vec3(y, cb, cr);
            }

            void main(){
              // 1) Rand zuschneiden (falls unsaubere Video-Ränder da sind)
              if (vUv.x < edgeCrop || vUv.x > 1.0 - edgeCrop || vUv.y < edgeCrop || vUv.y > 1.0 - edgeCrop) {
                discard;
              }

              vec4 tex = texture2D(texture1, vUv);
              vec3 keyYC = rgb2ycbcr(keyColor);
              vec3 pixYC = rgb2ycbcr(tex.rgb);

              // 2) Abstand zum Grün berechnen
              float d = distance(pixYC.yz, keyYC.yz);
              
              // 3) Weiche Maske erstellen (0.0 = Grün/Unsichtbar, 1.0 = Animation/Sichtbar)
              float alpha = smoothstep(threshold - softness, threshold + softness, d);

              // Wenn der Pixel komplett transparent ist, berechnen wir ihn gar nicht erst
              if (alpha < 0.01) discard;

              // 4) Despill (Grünschleier von den Kanten der Animation entfernen)
              float avg = (tex.r + tex.b) * 0.5;
              float suppressedG = mix(tex.g, avg, clamp((1.0 - alpha) * spillSuppress, 0.0, 1.0));
              vec3 finalColor = vec3(tex.r, suppressedG, tex.b);

              // 5) Ausgabe mit echtem Alpha-Wert für Transparenz
              gl_FragColor = vec4(finalColor, alpha);
            }`;

          mesh.material = new THREE.ShaderMaterial({
            uniforms: {
              texture1: { value: videoTexture },
              keyColor: { value: new THREE.Color(data.color) },
              threshold: { value: data.threshold },
              softness: { value: data.softness },
              spillSuppress: { value: data.spillSuppress },
              edgeCrop: { value: data.edgeCrop }
            },
            vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
            fragmentShader: fragment,
            transparent: true,
            depthTest: true,
            side: THREE.DoubleSide
          });

          mesh.material.needsUpdate = true;
        };
        
        if (el.getObject3D && el.getObject3D('mesh')) attach(); 
        else el.addEventListener('loaded', attach);
      }
    });
  } catch(e) { console.error('chromakey component error', e); }
})();
          // Stabilize transforms: verbessert für Page 8-9
          AFRAME.registerComponent('stable-transform', {
            schema: { smoothing: { type: 'number', default: 0.35 } },
            init: function(){
              this.prevPos = new THREE.Vector3();
              this.prevQuat = new THREE.Quaternion();
              this.first = true;
            },
            tick: function(time, delta){
              const obj = this.el.object3D;
              if (!obj) return;
              if (this.first) {
                this.prevPos.copy(obj.position);
                this.prevQuat.copy(obj.quaternion);
                this.first = false;
                return;
              }
              const alpha = 1 - Math.exp(-this.data.smoothing * (delta/16.666));

              this.prevPos.lerp(obj.position, alpha);
              obj.position.copy(this.prevPos);

              this.prevQuat.slerp(obj.quaternion, alpha);
              obj.quaternion.copy(this.prevQuat);
            }
          });

        } catch(e){ console.error('Failed to register chromakey component', e); }
      })();
    </script>

    <script>
      (function(){
        const mainAudio = document.getElementById('mainAudio');
        const loader = document.getElementById('arLoader');
        const loaderBar = document.getElementById('loaderBar');
        const loaderText = document.getElementById('loaderText');
        const playOverlay = document.getElementById('playOverlay');
        const playButton = document.getElementById('playButton');
        const enableSoundBtn = document.getElementById('enableSound');
        const muteToggle = document.getElementById('muteToggle');

        const controlBar = document.getElementById('controlBar');
        const progressSlider = document.getElementById('progressSlider');
        const pageInfo = document.getElementById('pageInfo');
        const timeDisplay = document.getElementById('timeDisplay');

        const chromakeyPanel = document.getElementById('chromakeyPanel');
        const ck_threshold = document.getElementById('ck-threshold');
        const ck_softness = document.getElementById('ck-softness');
        const ck_spill = document.getElementById('ck-spill');
        const ck_edgecrop = document.getElementById('ck-edgecrop');
        const ck_erode = document.getElementById('ck-erode');
        const ck_threshold_val = document.getElementById('ck-threshold-val');
        const ck_softness_val = document.getElementById('ck-softness-val');
        const ck_spill_val = document.getElementById('ck-spill-val');
        const ck_edgecrop_val = document.getElementById('ck-edgecrop-val');
        const ck_erode_val = document.getElementById('ck-erode-val');
        const ck_reset = document.getElementById('ck-reset');
        const ck_close = document.getElementById('ck-close');

        const mappings = [
          { targetId: 'target_p1', videoId: 'vid_p1', pageRange: '1' },
          { targetId: 'target_p4_5', videoId: 'vid_p4_5', pageRange: '4-5' },
          { targetId: 'target_p6_7', videoId: 'vid_p6_7', pageRange: '6-7' },
          { targetId: 'target_p8_9', videoId: 'vid_p8_9', pageRange: '8-9' },
          { targetId: 'target_p10_11', videoId: 'vid_p10_11', pageRange: '10-11' },
          { targetId: 'target_p12_13', videoId: 'vid_p12_13', pageRange: '12-13' },
          { targetId: 'target_p14_15', videoId: 'vid_p14_15', pageRange: '14-15' },
          { targetId: 'target_p16_17', videoId: 'vid_p16_17', pageRange: '16-17' },
          { targetId: 'target_p18_19', videoId: 'vid_p18_19', pageRange: '18-19' },
          { targetId: 'target_p20_21', videoId: 'vid_p20_21', pageRange: '20-21' },
          { targetId: 'target_p22_23', videoId: 'vid_p22_23', pageRange: '22-23' }
        ];

        // Wie viele Nachbar-Segmente links/rechts vom aktuellen immer "warmgehalten" (durchgehend abgespielt) werden.
        // Höher = zuverlässiger gegen schwarze Frames, aber mehr gleichzeitige Video-Decoder. 1 ist ein guter Kompromiss.
        const PRELOAD_WINDOW = 1;

        let videosReady = false;
        let totalVideos = mappings.length;
        let preloadedCount = 0;
        let mappingData = {};
        let rafId = null;
        let audioStarted = false;
        let controlBarShown = false;
        let chromakeySettings = JSON.parse(localStorage.getItem('tropfen.chromakey') || '{}');

        // Fortschritt pro Video (0..1), wird von waitForFullBuffer laufend aktualisiert und von
        // updateAggregateProgress zu einer Gesamt-Ladeanzeige zusammengefasst.
        const videoProgress = {};

        function setLoaderProgress(percentage, text){ if (loaderBar) loaderBar.style.width = (percentage*100)+'%'; if (loaderText && text) loaderText.textContent = text; }

        function updateAggregateProgress(extraLabel){
          const values = mappings.map(m => videoProgress[m.videoId] || 0);
          const total = values.reduce((a,b)=>a+b, 0) / mappings.length;
          setLoaderProgress(total, extraLabel || `Lade Videos… ${Math.round(total*100)}%`);
        }

        function bufferedFractionOf(v){
          try {
            if (!v.duration || !isFinite(v.duration) || v.duration <= 0) return 0;
            const b = v.buffered;
            if (!b || b.length === 0) return 0;
            // Nimm den Bereich, der bei Zeit 0 beginnt (das ist der relevante für sequenzielles Abspielen)
            let end = 0;
            for (let i=0;i<b.length;i++){ if (b.start(i) <= 0.05) { end = Math.max(end, b.end(i)); } }
            return Math.min(1, end / v.duration);
          } catch(e){ return 0; }
        }

        // Wartet bis ein Video flüssig abspielbar ist (readyState >= 3 = genug Daten für unterbrechungsfreies
        // Abspielen ab dem aktuellen Punkt). Das ist bewusst NICHT "100% der Datei heruntergeladen" -
        // darauf zu warten kann bei größeren Dateien/langsamerer Verbindung sehr lange dauern oder nie
        // eintreten. Der Fortschrittsbalken zeigt trotzdem den echten Puffer-Fortschritt an.
        function waitUntilPlayable(v, videoId, timeoutMs=15000){
          return new Promise((resolve) => {
          let settled = false;
          const finish = (ok) => {
          if (settled) return; settled = true;
            v.removeEventListener('loadedmetadata', onMeta);
            v.removeEventListener('error', onError);
          resolve(ok);
          };  
    
        // Wenn die Metadaten schon da sind, sofort weitermachen
        if (v.readyState >= 1) { 
          videoProgress[videoId] = 1;
        return finish(true); 
        }

        const onMeta = () => {
          videoProgress[videoId] = 1;
          updateAggregateProgress();
          finish(true);
        };
        const onError = () => { console.warn('Video-Fehler', videoId); finish(false); };

          v.addEventListener('loadedmetadata', onMeta);
          v.addEventListener('error', onError);
    
      // Fallback nach Timeout
      setTimeout(() => { videoProgress[videoId] = 1; finish(true); }, timeoutMs);
      });
    }
        async function loadVideoFully(m, attempt=1){
          const v = document.getElementById(m.videoId);
          if (!v) { videoProgress[m.videoId] = 1; return; }
          v.preload = 'auto'; v.playsInline = true; v.setAttribute('webkit-playsinline',''); v.crossOrigin = 'anonymous';
          videoProgress[m.videoId] = 0;
          v.load();

          const playable = await waitUntilPlayable(v, m.videoId, 20000);

          if (!playable && attempt < 2) {
            console.warn(`Video ${m.videoId} noch nicht bereit, einmaliger erneuter Versuch…`);
            setLoaderProgress(videoProgress[m.videoId] || 0, `${m.videoId}: erneuter Ladeversuch…`);
            v.load();
            return loadVideoFully(m, attempt + 1);
          }
          if (!playable) {
            console.warn(`Video ${m.videoId} konnte nicht rechtzeitig geladen werden, fahre trotzdem fort (lädt im Hintergrund weiter).`);
          }
          // Sicherstellen, dass Video weiter im Hintergrund puffert, auch wenn wir schon weitermachen
          videoProgress[m.videoId] = Math.max(videoProgress[m.videoId] || 0, playable ? 1 : videoProgress[m.videoId] || 0);
          updateAggregateProgress();

          const dur = (v.duration && !isNaN(v.duration) && isFinite(v.duration)) ? v.duration : 0;
          mappingData[m.videoId] = { duration: dur || 0, startTime: 0 };
          try { v.muted = true; await v.play(); v.pause(); v.currentTime = 0; } catch(e){}
        }

        async function preloadAllVideos(){
          preloadedCount = 0; mappingData = {};
          for (const m of mappings) videoProgress[m.videoId] = 0;

          for (const m of mappings) {
            try { await loadVideoFully(m); } catch(e){ console.warn('preload error', m.videoId, e); }

            preloadedCount++;
          }

          // second pass for missing durations
          for (const m of mappings) {
            const v = document.getElementById(m.videoId);
            if (!v) continue;
            if (!mappingData[m.videoId] || mappingData[m.videoId].duration === 0) {
              if (v.duration && !isNaN(v.duration) && isFinite(v.duration)) mappingData[m.videoId] = { duration: v.duration, startTime: 0 };
            }
          }

          // compute sequential start times
          let t = 0; for (const m of mappings) { const d = mappingData[m.videoId] && mappingData[m.videoId].duration ? mappingData[m.videoId].duration : 0; mappingData[m.videoId].startTime = t; t += d; }

          videosReady = true; setLoaderProgress(1, 'Fertig geladen');
          setTimeout(()=>{ if (loader) loader.classList.add('hidden'); }, 500);
        }

        async function startMindARAfterPreload(){
          const start = performance.now(); while (!videosReady && performance.now()-start < 30000) await new Promise(r=>setTimeout(r,200));
          const scene = document.querySelector('a-scene'); if (!scene) { console.error('a-scene not found'); return; }
          let mindar = null; const keys = [...Object.keys(scene.systems||{}), ...Object.keys(scene.components||{})]; for (const k of keys) { const obj = (scene.systems && scene.systems[k]) || (scene.components && scene.components[k]); if (obj && typeof obj.start === 'function') { mindar = obj; break; } }
          if (!mindar) { console.error('MindAR start() not found'); return; }
          try { await mindar.start(); console.log('MindAR started');
            try {
              if (scene.renderer && typeof scene.renderer.setPixelRatio === 'function') {
                scene.renderer.setPixelRatio(window.devicePixelRatio || 1);
              }
            } catch(e) { console.warn('setPixelRatio failed', e); }
          } catch(e){ console.warn('MindAR start error', e); }
        }

        // Findet den Index des Segments, in dem sich Zeit t gerade befindet (oder das zuletzt begonnene, falls dazwischen).
        function findCurrentIndex(t){
          for (let i=0;i<mappings.length;i++){
            const md = mappingData[mappings[i].videoId] || { startTime:0, duration:0 };
            if (t >= md.startTime && t < md.startTime + md.duration) return i;
          }
          for (let i=mappings.length-1;i>=0;i--){
            const md = mappingData[mappings[i].videoId] || { startTime:0, duration:0 };
            if (t >= md.startTime) return i;
          }
          return 0;
        }

        // Hält das aktuelle Segment + PRELOAD_WINDOW Nachbarn links/rechts durchgehend am Laufen (gemutet, geloopt),
        // statt Videos exakt bei Bedarf zu starten. Dadurch ist beim Erreichen eines Zeitfensters der Decoder
        // bereits warm und gepuffert - kein schwarzer Frame mehr, egal ob vor- oder rückwärts.
        function syncVideos(t, force){
          const currentIndex = findCurrentIndex(t);

          for (let i=0;i<mappings.length;i++){
            const m = mappings[i];
            const v = document.getElementById(m.videoId);
            if (!v) continue;
            const md = mappingData[m.videoId] || { startTime:0, duration:0 };
            const rel = t - md.startTime;
            const withinWindow = Math.abs(i - currentIndex) <= PRELOAD_WINDOW;

            if (withinWindow) {
              const clampedRel = Math.max(0, Math.min(rel, (md.duration || 0.001) - 0.05));
              if (force || v.paused) {
                try { v.currentTime = clampedRel; } catch(e){}
                try { v.play().catch(()=>{}); } catch(e){}
              } else if (Math.abs(v.currentTime - clampedRel) > 0.35) {
                // Drift-Korrektur nur bei größerer Abweichung, um Ruckeln zu vermeiden
                try { v.currentTime = clampedRel; } catch(e){}
              }
            } else {
              if (!v.paused) { try { v.pause(); } catch(e){} }
            }
          }

          return { currentIndex };
        }

        function startSequenceController(){
          function step(){
            if (!audioStarted) { rafId = requestAnimationFrame(step); return; }
            const a = mainAudio; if (!a || a.paused) { rafId = requestAnimationFrame(step); return; }
            const t = a.currentTime;

            // Update progress slider
            const totalDuration = a.duration || 1;
            progressSlider.value = (t / totalDuration) * 100;
            timeDisplay.textContent = formatTime(t);

            const { currentIndex } = syncVideos(t, false);
            pageInfo.textContent = `Seite: ${mappings[currentIndex] ? mappings[currentIndex].pageRange : '--'}`;

            rafId = requestAnimationFrame(step);
          }
          if (!rafId) rafId = requestAnimationFrame(step);
        }

        function formatTime(seconds) {
          if (!isFinite(seconds)) return '0:00';
          const mins = Math.floor(seconds / 60);
          const secs = Math.floor(seconds % 60);
          return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function showControlBarPermanently(){
          if (controlBarShown) return;
          controlBarShown = true;
          controlBar.classList.add('visible');
        }

        function setupPlayOverlayForAllTargets(){
          for (const m of mappings) {
            const targetEl = document.getElementById(m.targetId);
            if (!targetEl) continue;
            targetEl.addEventListener('targetFound', () => { if (!videosReady) return; if (!audioStarted) playOverlay.classList.remove('hidden'); });
            targetEl.addEventListener('targetLost', () => { playOverlay.classList.add('hidden'); });
            // Hinweis: die Control-Bar wird bewusst NICHT mehr bei targetLost/Pause versteckt (siehe showControlBarPermanently).
          }
        }

        function togglePlayback(shouldPlay){
          if (shouldPlay) {
            playOverlay.classList.add('hidden');
            try { if (mainAudio) { mainAudio.muted = false; mainAudio.play().catch(()=>{}); } } catch(e){ console.warn('audio play failed', e); }
            syncVideos(mainAudio ? mainAudio.currentTime : 0, true);
            audioStarted = true;
            showControlBarPermanently();
            startSequenceController();
          } else {
            try { if (mainAudio && !mainAudio.paused) mainAudio.pause(); } catch(e){}
            for (const m of mappings) { const v = document.getElementById(m.videoId); try { if (v && !v.paused) v.pause(); } catch(e){} }
            audioStarted = false;
            playOverlay.classList.remove('hidden');
            // controlBar bleibt sichtbar - nur der Play-Button erscheint wieder
          }
        }

        playButton.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          togglePlayback(true);
        });

        // Progress slider seek
        progressSlider.addEventListener('input', (ev) => {
          if (!mainAudio || !audioStarted) return;
          const newTime = (parseFloat(ev.target.value) / 100) * mainAudio.duration;
          mainAudio.currentTime = newTime;
          syncVideos(newTime, true);
        });

        document.addEventListener('click', (ev)=>{
          if (ev.target.closest('#playOverlay') || ev.target.closest('#chromakeyPanel') || ev.target.closest('#enableSound') || ev.target.closest('#muteToggle') || ev.target.closest('#controlBar')) return;
          if (audioStarted) {
            togglePlayback(false);
          }
        });

        // Mute toggle with visual feedback
        function updateMuteIcon(){
          const path = document.getElementById('muteIcon');
          if (!path) return;
          if (!mainAudio) return;
          if (mainAudio.muted) {
            muteToggle.classList.add('muted');
            path.setAttribute('d', 'M16.5 12c0-1.77-.77-3.36-1.98-4.47L14 8v8l.52-.53C15.73 15.36 16.5 13.77 16.5 12z M3 10v4h4l5 5V5L7 10H3z');
          } else {
            muteToggle.classList.remove('muted');
            path.setAttribute('d', 'M3 10v4h4l5 5V5L7 10H3z');
          }
        }

        muteToggle.addEventListener('click', (ev)=>{
          ev.stopPropagation();
          if (!mainAudio) return;
          mainAudio.muted = !mainAudio.muted;
          updateMuteIcon();
        });

        function showEnableSound(debug){ if (!enableSoundBtn) return; enableSoundBtn.setAttribute('aria-hidden','false'); enableSoundBtn.style.display='inline-block'; if (debug) enableSoundBtn.classList.add('debug-visible'); }
        function hideEnableSound(){ if (!enableSoundBtn) return; enableSoundBtn.setAttribute('aria-hidden','true'); enableSoundBtn.style.display='none'; enableSoundBtn.classList.remove('debug-visible'); }
        enableSoundBtn.addEventListener('click', async ()=>{ try{ if (mainAudio) mainAudio.muted = false; if (mainAudio) await mainAudio.play(); hideEnableSound(); updateMuteIcon(); } catch(e){ console.warn('enable sound failed', e); } });


          // Update display values
          ck_threshold_val.textContent = threshold.toFixed(2);
          ck_softness_val.textContent = softness.toFixed(2);
          ck_spill_val.textContent = spill.toFixed(2);
          ck_edgecrop_val.textContent = edgeCrop.toFixed(3);
          ck_erode_val.textContent = edgeErode.toFixed(2);

          // Save to localStorage
          chromakeySettings = { threshold, softness, spill, edgeCrop, edgeErode };
          localStorage.setItem('tropfen.chromakey', JSON.stringify(chromakeySettings));
        }

        ck_threshold.addEventListener('input', updateAllChromakeyShaders);
        ck_softness.addEventListener('input', updateAllChromakeyShaders);
        ck_spill.addEventListener('input', updateAllChromakeyShaders);
        ck_edgecrop.addEventListener('input', updateAllChromakeyShaders);
        ck_erode.addEventListener('input', updateAllChromakeyShaders);

        ck_reset.addEventListener('click', () => {
          ck_threshold.value = 0.12;
          ck_softness.value = 0.05;
          ck_spill.value = 0.92;
          ck_edgecrop.value = 0.02;
          ck_erode.value = 0.15;
          updateAllChromakeyShaders();
        });

        ck_close.addEventListener('click', () => {
          chromakeyPanel.classList.remove('visible');
        });

  

        // Entfernt AR/VR/XR-Enter-Buttons aktiv aus dem DOM, falls A-Frame sie per Inline-Style
        // wieder sichtbar macht (die CSS-Regel allein reicht bei manchen A-Frame Versionen nicht).
        function removeXrButtons(){
          const selectors = '.a-enter-vr, .a-enter-vr-button, .a-enter-ar, .a-enter-ar-button, .a-enter-xr, .a-enter-xr-button, [class*="enter-vr"], [class*="enter-ar"], [class*="enter-xr"]';
          document.querySelectorAll(selectors).forEach(el => el.remove());
        }

        window.addEventListener('load', async ()=>{
          if (loader) loader.classList.remove('hidden'); setLoaderProgress(0,'Starte Laden...'); await preloadAllVideos(); await startMindARAfterPreload(); attachVisibilityHandlers(); setupPlayOverlayForAllTargets();
          removeXrButtons();
          setTimeout(removeXrButtons, 1000);
          setTimeout(removeXrButtons, 3000);
          const scene = document.querySelector('a-scene');
          if (scene) scene.addEventListener('loaded', removeXrButtons);

          // Restore chromakey settings
          if (chromakeySettings.threshold !== undefined) ck_threshold.value = chromakeySettings.threshold;
          if (chromakeySettings.softness !== undefined) ck_softness.value = chromakeySettings.softness;
          if (chromakeySettings.spill !== undefined) ck_spill.value = chromakeySettings.spill;
          if (chromakeySettings.edgeCrop !== undefined) ck_edgecrop.value = chromakeySettings.edgeCrop;
          if (chromakeySettings.edgeErode !== undefined) ck_erode.value = chromakeySettings.edgeErode;
          updateAllChromakeyShaders();
        });

        window.__TROPFEN = { mappings, mappingData, get videosReady(){ return videosReady; }, get audioStarted(){ return audioStarted; }, get chromakeySettings(){ return chromakeySettings; } };
      })();
    </script>
  </body>
</html>

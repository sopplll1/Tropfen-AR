<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>AR Comic — index</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Swanky+and+Moo+Moo&display=swap" rel="stylesheet">

    <!-- A-Frame (stabile Version) -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

    <!-- MindAR core + A-Frame integration (stabile Version) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,body { height:100%; margin:0; background:#000; font-family: 'Swanky and Moo Moo', cursive; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
      a-scene { position: absolute; inset: 0; width:100%; height:100%; }

      /* Loader / fullscreen progress */
      #arLoader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10000; background: rgba(0,0,0,0.85); color:#fff; flex-direction:column;
      }
      #arLoader.hidden { display: none; }
      #arLoader .box { padding: 16px 18px; border-radius: 12px; text-align:center; }
      #arLoader .progress { width: 320px; height: 10px; background: rgba(255,255,255,0.12); border-radius:6px; overflow:hidden; margin-top:12px; }
      #arLoader .progress > i { display:block; height:100%; background: linear-gradient(90deg,#4ade80,#06b6d4); width:0%; }

      /* Center play overlay */
      #playOverlay { position: fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:11000; pointer-events:none; }
      #playOverlay.hidden { display:none; }
      #playOverlay button { pointer-events:auto; background: rgba(255,255,255,0.95); border:none; padding:18px 28px; font-size:20px; border-radius:999px; cursor:pointer; }

      /* Fallback control */
      #enableSound { position: fixed; left: 50%; transform: translateX(-50%); bottom: 5vh; z-index: 9999; display: none; background: rgba(42,55,106,0.95); color: #fff; border: none; padding: 10px 18px; font-size: 15px; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: rgba(0,0,0,0); }
      #enableSound[aria-hidden="false"] { display: inline-block; }

      a-scene { z-index: 1; }
      a-scene canvas { position: absolute; left: 0; top: 0; width: 100% !important; height: 100% !important; z-index: 1 !important; }
    </style>
  </head>

  <body>
    <!-- Loader shown until all videos preloaded -->
    <div id="arLoader"><div class="box"><div id="loaderText">Lade AR-Inhalte…</div><div class="progress"><i id="loaderBar"></i></div></div></div>

    <!-- Play overlay (shown when page 4_5 is found and videosReady true) -->
    <div id="playOverlay" class="hidden"><button id="playButton">Play</button></div>

    <!-- Fallback button -->
    <button id="enableSound" aria-hidden="true">Ton aktivieren</button>

    <!-- MindAR scene -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: true; uiScanning: true; uiError: true; uiTarget: true" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: false" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
      <a-assets>
        <audio id="mainAudio" src="./assets/Kompletter_song.mp3" crossorigin="anonymous" preload="auto"></audio>

        <!-- Videos: preload handled by script (we keep preload attributes minimal here) -->
        <video id="vid_p1" src="./assets/Page_1.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p4_5" src="./assets/Page_4_5.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p6_7" src="./assets/Page_6_7.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p8_9" src="./assets/Page_8_9.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p10_11" src="./assets/Page_10_11.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p12_13" src="./assets/Page_12_13.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p14_15" src="./assets/Page_14_15.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p16_17" src="./assets/Page_16_17.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p18_19" src="./assets/Page_18_19.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p20_21" src="./assets/Page_20_21.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <video id="vid_p22_23" src="./assets/Page_22_23.mp4" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Targets: videos invisible until shown on scan -->
      <a-entity id="target_p1" mindar-image-target="targetIndex: 0"><a-video visible="false" src="#vid_p1" chromakey="videoSelector: #vid_p1; color: #00FF00" position="0 0 0.001" height="1" width="1"></a-video></a-entity>
      <a-entity id="target_p4_5" mindar-image-target="targetIndex: 1"><a-video visible="false" src="#vid_p4_5" chromakey="videoSelector: #vid_p4_5; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p6_7" mindar-image-target="targetIndex: 2"><a-video visible="false" src="#vid_p6_7" chromakey="videoSelector: #vid_p6_7; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p8_9" mindar-image-target="targetIndex: 3"><a-video visible="false" src="#vid_p8_9" chromakey="videoSelector: #vid_p8_9; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p10_11" mindar-image-target="targetIndex: 4"><a-video visible="false" src="#vid_p10_11" chromakey="videoSelector: #vid_p10_11; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p12_13" mindar-image-target="targetIndex: 5"><a-video visible="false" src="#vid_p12_13" chromakey="videoSelector: #vid_p12_13; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p14_15" mindar-image-target="targetIndex: 6"><a-video visible="false" src="#vid_p14_15" chromakey="videoSelector: #vid_p14_15; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p16_17" mindar-image-target="targetIndex: 7"><a-video visible="false" src="#vid_p16_17" chromakey="videoSelector: #vid_p16_17; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p18_19" mindar-image-target="targetIndex: 8"><a-video visible="false" src="#vid_p18_19" chromakey="videoSelector: #vid_p18_19; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p20_21" mindar-image-target="targetIndex: 9"><a-video visible="false" src="#vid_p20_21" chromakey="videoSelector: #vid_p20_21; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
      <a-entity id="target_p22_23" mindar-image-target="targetIndex: 10"><a-video visible="false" src="#vid_p22_23" chromakey="videoSelector: #vid_p22_23; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2"></a-video></a-entity>
    </a-scene>

    <script>
      (function(){
        const mainAudio = document.getElementById('mainAudio');
        const loader = document.getElementById('arLoader');
        const loaderBar = document.getElementById('loaderBar');
        const loaderText = document.getElementById('loaderText');
        const playOverlay = document.getElementById('playOverlay');
        const playButton = document.getElementById('playButton');
        const enableSoundBtn = document.getElementById('enableSound');

        // mappings in desired playback order (this order defines the sequence of videos in the song)
        const mappings = [
          { targetId: 'target_p4_5', videoId: 'vid_p4_5' },
          { targetId: 'target_p6_7', videoId: 'vid_p6_7' },
          { targetId: 'target_p8_9', videoId: 'vid_p8_9' },
          { targetId: 'target_p10_11', videoId: 'vid_p10_11' },
          { targetId: 'target_p12_13', videoId: 'vid_p12_13' },
          { targetId: 'target_p14_15', videoId: 'vid_p14_15' },
          { targetId: 'target_p16_17', videoId: 'vid_p16_17' },
          { targetId: 'target_p18_19', videoId: 'vid_p18_19' },
          { targetId: 'target_p20_21', videoId: 'vid_p20_21' },
          { targetId: 'target_p22_23', videoId: 'vid_p22_23' },
          { targetId: 'target_p1', videoId: 'vid_p1' }
        ];

        // state
        let videosReady = false;
        let durationsCollected = false;
        let sequenceComputed = false;
        let totalVideos = mappings.length;
        let preloadedCount = 0;
        let mappingData = {}; // map videoId -> { duration, startTime }
        let rafId = null;
        let audioStarted = false;

        // helpers
        function setLoaderProgress(percentage, text){ if (loaderBar) loaderBar.style.width = (percentage*100)+'%'; if (loaderText && text) loaderText.textContent = text; }

        function ensureVideoReady(v, timeout=10000){
          return new Promise(res => {
            if (!v) return res(false);
            if (v.readyState >= 3) return res(true);
            let done = false;
            const ok = () => { if (done) return; done = true; clearTimeout(t); res(true); };
            v.addEventListener('canplay', ok, { once:true });
            v.addEventListener('canplaythrough', ok, { once:true });
            const t = setTimeout(()=>{ if (!done) { done = true; res(false); } }, timeout);
          });
        }

        // sequential preload & metadata collection
        async function preloadAllVideos() {
          preloadedCount = 0;
          mappingData = {};
          for (const m of mappings) {
            const v = document.getElementById(m.videoId);
            if (!v) { preloadedCount++; setLoaderProgress(preloadedCount/totalVideos, `Fehlt: ${m.videoId}`); continue; }
            try {
              // ensure media attributes
              v.preload = 'auto'; v.playsInline = true; v.setAttribute('webkit-playsinline',''); v.crossOrigin = 'anonymous';
              v.load();
              const ready = await ensureVideoReady(v, 12000);
              if (!ready) console.warn('Video not ready quickly', m.videoId);

              // attempt to get metadata duration
              const dur = (v.duration && !isNaN(v.duration) && isFinite(v.duration)) ? v.duration : null;
              mappingData[m.videoId] = { duration: dur || 0, startTime: 0 };

              // prime decoder: play muted shortly
              try { v.muted = true; await v.play(); v.pause(); v.currentTime = 0; } catch(e) { /* ignore */ }
            } catch (e) { console.warn('preload error', m.videoId, e); }
            preloadedCount++; setLoaderProgress(preloadedCount/totalVideos, `Lade ${preloadedCount}/${totalVideos}`);
            // small stagger to avoid saturating network/decoder
            await new Promise(r => setTimeout(r, 300));
          }

          // if any duration missing, try a second pass to read duration after more data
          for (const m of mappings) {
            const v = document.getElementById(m.videoId);
            if (!v) continue;
            if (!mappingData[m.videoId].duration || mappingData[m.videoId].duration === 0) {
              if (v.duration && !isNaN(v.duration) && isFinite(v.duration)) mappingData[m.videoId].duration = v.duration;
            }
          }

          durationsCollected = true;

          // compute start times sequentially (in mapping order)
          let t = 0;
          for (const m of mappings) {
            const d = mappingData[m.videoId] && mappingData[m.videoId].duration ? mappingData[m.videoId].duration : 0;
            mappingData[m.videoId].startTime = t;
            t += d;
          }

          sequenceComputed = true;
          videosReady = true;
          setLoaderProgress(1, 'Fertig geladen');
          // hide loader after small delay
          setTimeout(()=>{ if (loader) loader.classList.add('hidden'); }, 600);
        }

        // Start MindAR (camera) only after preload finished
        async function startMindARAfterPreload() {
          // Wait until preloadAllVideos finished (or timeout)
          const start = performance.now();
          while (!videosReady && performance.now()-start < 30000) { await new Promise(r=>setTimeout(r,200)); }

          // Now request camera permissions and start mindar
          const scene = document.querySelector('a-scene');
          if (!scene) { console.error('a-scene not found'); return; }
          // find mindar system
          let mindar = null; const keys = [...Object.keys(scene.systems||{}), ...Object.keys(scene.components||{})];
          for (const k of keys) { const obj = (scene.systems && scene.systems[k]) || (scene.components && scene.components[k]); if (obj && typeof obj.start === 'function') { mindar = obj; break; } }
          if (!mindar) { console.error('MindAR start() not found'); return; }

          try { await mindar.start(); console.log('MindAR started (camera permission requested)'); }
          catch(e) { console.warn('MindAR start error', e); }
        }

        // When audio is playing, update videos so they follow the sequence
        function startSequenceController(){
          function step(){
            if (!audioStarted) { rafId = requestAnimationFrame(step); return; }
            const a = mainAudio; if (!a || a.paused) { rafId = requestAnimationFrame(step); return; }
            const t = a.currentTime;
            for (const m of mappings) {
              const v = document.getElementById(m.videoId);
              if (!v) continue;
              const md = mappingData[m.videoId] || { startTime:0, duration:0 };
              const start = md.startTime || 0; const dur = md.duration || 0;
              const rel = t - start;
              if (rel >= 0 && rel < dur) {
                // this video should be playing at rel
                try {
                  if (Math.abs(v.currentTime - rel) > 0.15) v.currentTime = rel;
                  if (v.paused) v.play().catch(()=>{});
                } catch(e){}
              } else {
                // pause and reset slightly to save decoding
                try { if (!v.paused) v.pause(); } catch(e){}
              }
            }
            rafId = requestAnimationFrame(step);
          }
          if (!rafId) rafId = requestAnimationFrame(step);
        }

        // UI: show play button when target_p4_5 found and videosReady
        function setupTargetPlayButton(targetIdToWatch){
          const targetEl = document.getElementById(targetIdToWatch);
          if (!targetEl) return;
          targetEl.addEventListener('targetFound', () => {
            if (!videosReady) return; // wait
            // show play overlay only if audio not started
            if (!audioStarted) { playOverlay.classList.remove('hidden'); }
          });
          targetEl.addEventListener('targetLost', () => { playOverlay.classList.add('hidden'); });
        }

        // when play pressed: start audio and sequence controller
        playButton.addEventListener('click', async () => {
          playOverlay.classList.add('hidden');
          // unmute and play audio (user gesture)
          try {
            if (mainAudio) { mainAudio.muted = false; await mainAudio.play(); audioStarted = true; }
          } catch (e) {
            console.warn('audio play failed', e); audioStarted = false; showEnableSound(true); return; }

          // start sequence controller to drive background videos
          startSequenceController();
        });

        // enableSound fallback
        enableSoundBtn.addEventListener('click', async () => { try { if (mainAudio) mainAudio.muted = false; if (mainAudio) await mainAudio.play(); hideEnableSound(); } catch(e){ console.warn(e); } });

        // When any target is found, make the corresponding a-video visible; when lost, hide it
        function attachVisibilityHandlers(){
          for (const m of mappings) {
            const targetEl = document.getElementById(m.targetId);
            const aVideoEntity = document.querySelector(`#${m.targetId} a-video`);
            if (!targetEl || !aVideoEntity) continue;
            targetEl.addEventListener('targetFound', () => {
              // show entity only when its time window is active OR always show but video will be paused if not in window
              aVideoEntity.setAttribute('visible','true');
            });
            targetEl.addEventListener('targetLost', () => {
              aVideoEntity.setAttribute('visible','false');
            });
          }
        }

        // entry point
        window.addEventListener('load', async () => {
          // show loader
          if (loader) loader.classList.remove('hidden');
          setLoaderProgress(0, 'Starte Laden...');

          // preload all videos sequentially
          await preloadAllVideos();

          // after preload, compute sequence already done in preloadAllVideos; next: start camera
          await startMindARAfterPreload();

          // attach visibility handlers and play button trigger for page 4_5
          attachVisibilityHandlers();
          setupTargetPlayButton('target_p4_5');

          // hide loader if still visible
          if (loader) loader.classList.add('hidden');
        });

        // expose state for debugging
        window.__TROPFEN = { mappings, mappingData, get videosReady(){ return videosReady; }, get audioStarted(){ return audioStarted; } };
      })();
    </script>
  </body>
</html>

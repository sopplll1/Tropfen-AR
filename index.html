<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    
    <!-- Die stabilsten Core-Skripte (A-Frame und MindAR) -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>

    <!-- Greenscreen-Filter Shader (Chroma Key) -->
    <script>
      AFRAME.registerComponent('chromakey', {
        schema: { color: {type: 'color', default: '#00FF00'} },
        init: function () {
          let mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.material = new THREE.ShaderMaterial({
            uniforms: {
              texture1: { value: new THREE.VideoTexture(this.el.getContext('video')) },
              color: { value: new THREE.Color(this.data.color) }
            },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
            fragmentShader: `varying vec2 vUv; uniforms sampler2D texture1; uniforms vec3 color; void main() { vec4 tColor = texture2D(texture1, vUv); float difference = distance(tColor.rgb, color); if (difference < 0.45) { discard; } else { gl_FragColor = tColor; } }`,
            transparent: true
          });
        }
      });
    </script>
  </head>
  
  <body>
    <!-- Die AR-Szene startet jetzt direkt nativ mit Autostart -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- Master-Song -->
        <audio id="mainAudio" src="./assets/kompletter_song.mp3" crossorigin="anonymous" preload="auto"></audio>
        
        <!-- Ihre stummen Videos mit erzwungenem Lazy-Loading -->
        <video id="vid_p1" src="./assets/Page_1.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p4_5" src="./assets/Page_4_5.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p6_7" src="./assets/Page_6_7.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p8_9" src="./assets/Page_8_9.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p10_11" src="./assets/Page_10_11.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p12_13" src="./assets/Page_12_13.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p14_15" src="./assets/Page_14_15.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p16_17" src="./assets/Page_16_17.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p18_19" src="./assets/Page_18_19.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p20_21" src="./assets/Page_20_21.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p22_23" src="./assets/Page_22_23.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
        <video id="vid_p24" src="./assets/Page_24.mp4" loop="true" crossorigin="anonymous" playsinline muted preload="none"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Cover quadratisch -->
      
        <a-video src="#vid_p1" chromakey="color: #00FF00" position="0 0 0" height="1" width="1" scale="1.16 1.16 1.16"></a-video>
      

      <!-- Targets 1-10: Doppelseiten 2:1 Format -->
      
        <a-video src="#vid_p4_5" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p6_7" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p8_9" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p10_11" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p12_13" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p14_15" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p16_17" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p18_19" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p20_21" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
        <a-video src="#vid_p22_23" chromakey="color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      
      
    </a-scene>

    <script>
      const mainAudio = document.querySelector('#mainAudio');
      const loopDuration = 4.0; 

      // Automatische Aktivierung des globalen Audio-Taktgebers beim ersten Touch auf den Screen
      // (Wichtig, damit iOS/Android den Sound im Hintergrund starten erlauben)
      window.addEventListener('click', () => {
        if(mainAudio.paused) {
          mainAudio.play().catch(e => console.log("Audio gestartet"));
        }
      }, { once: true });

      const targets = [
        { el: document.querySelector('#target_p1'), vid: document.querySelector('#vid_p1') },
        { el: document.querySelector('#target_p4_5'), vid: document.querySelector('#vid_p4_5') },
        { el: document.querySelector('#target_p6_7'), vid: document.querySelector('#vid_p6_7') },
        { el: document.querySelector('#target_p8_9'), vid: document.querySelector('#vid_p8_9') },
        { el: document.querySelector('#target_p10_11'), vid: document.querySelector('#vid_p10_11') },
        { el: document.querySelector('#target_p12_13'), vid: document.querySelector('#vid_p12_13') },
        { el: document.querySelector('#target_p14_15'), vid: document.querySelector('#vid_p14_15') },
        { el: document.querySelector('#target_p16_17'), vid: document.querySelector('#vid_p16_17') },
        { el: document.querySelector('#target_p18_19'), vid: document.querySelector('#vid_p18_19') },
        { el: document.querySelector('#target_p20_21'), vid: document.querySelector('#vid_p20_21') },
        { el: document.querySelector('#target_p22_23'), vid: document.querySelector('#vid_p22_23') },
      ];

      targets.forEach(target => {
        if(target.el && target.vid) {
          target.el.addEventListener("targetFound", () => {
            // Die Takt-Uhr (mainAudio) läuft unabhängig vom Ton im Hintergrund für den Modulo-Sync
            target.vid.currentTime = mainAudio.currentTime % loopDuration; 
            target.vid.play();
          });
          target.el.addEventListener("targetLost", () => {
            target.vid.pause();
          });
        }
      });
    </script>
  </body>
</html>

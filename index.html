<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>AR Comic — index</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Swanky+and+Moo+Moo&display=swap" rel="stylesheet">

    <!-- A-Frame (stabile explizite Version) -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

    <!-- MindAR A-Frame integration (stabile Version) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,body { height:100%; margin:0; background:#000; font-family: 'Swanky and Moo Moo', cursive; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
      a-scene { position: absolute; inset: 0; width:100%; height:100%; }

      /* Minimal unobtrusive audio enable button (hidden by default) */
      #enableSound {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 6vh;
        z-index: 9999;
        display: none;
        background: #2A376A;
        color: #fff;
        border: none;
        padding: 12px 22px;
        font-size: 16px;
        border-radius: 14px;
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(0,0,0,0);
      }
      #enableSound:active { transform: translateX(-50%) scale(0.98); }
      #enableSound[aria-hidden="false"] { display: inline-block; }
    </style>

    <script>
      // Chromakey shader component (robust)
      AFRAME.registerComponent('chromakey', {
        schema: {
          color: { type: 'color', default: '#00FF00' },
          videoSelector: { type: 'selector', default: null }
        },
        init: function () {
          const el = this.el;
          const self = this;

          const attach = () => {
            let videoEl = self.data.videoSelector;
            if (!videoEl) {
              const srcAttr = el.getAttribute('src');
              if (srcAttr && typeof srcAttr === 'string' && srcAttr.startsWith('#')) {
                videoEl = document.querySelector(srcAttr);
              }
            }
            if (!videoEl) return;

            // create video texture
            const videoTexture = new THREE.VideoTexture(videoEl);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.format = THREE.RGBFormat;

            const mesh = el.getObject3D('mesh');
            if (!mesh) return;

            mesh.material = new THREE.ShaderMaterial({
              uniforms: {
                texture1: { value: videoTexture },
                keyColor: { value: new THREE.Color(self.data.color) },
                threshold: { value: 0.45 }
              },
              vertexShader:
                'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
              fragmentShader:
                'precision mediump float; varying vec2 vUv; uniform sampler2D texture1; uniform vec3 keyColor; uniform float threshold; void main() { vec4 tex = texture2D(texture1, vUv); float d = distance(tex.rgb, keyColor); if (d < threshold) { discard; } gl_FragColor = tex; }',
              transparent: true,
              depthTest: true
            });
          };

          if (el.getObject3D('mesh')) {
            attach();
          } else {
            el.addEventListener('loaded', attach);
            setTimeout(attach, 300);
          }
        }
      });
    </script>
  </head>

  <body>
    <!-- a-scene: MindAR with UI helpers enabled so native UI is shown if needed -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: true; uiScanning: true; uiError: true; uiTarget: true"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: false"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <!-- Master-Audio (looped global metronome) -->
        <audio id="mainAudio" src="./assets/kompletter_song.mp3" crossorigin="anonymous" preload="auto" loop></audio>

        <!-- Videos: preload explicitly none (lazy load) -->
        <video id="vid_p1" src="./assets/Page_1.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p4_5" src="./assets/Page_4_5.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p6_7" src="./assets/Page_6_7.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p8_9" src="./assets/Page_8_9.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p10_11" src="./assets/Page_10_11.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p12_13" src="./assets/Page_12_13.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p14_15" src="./assets/Page_14_15.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p16_17" src="./assets/Page_16_17.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p18_19" src="./assets/Page_18_19.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p20_21" src="./assets/Page_20_21.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p22_23" src="./assets/Page_22_23.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
      </a-assets>

      <!-- Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Targets -->
      <a-entity id="target_p1" mindar-image-target="targetIndex: 0">
        <a-video src="#vid_p1" chromakey="videoSelector: #vid_p1; color: #00FF00" position="0 0 0" height="1" width="1" scale="1.16 1.16 1.16"></a-video>
      </a-entity>

      <a-entity id="target_p4_5" mindar-image-target="targetIndex: 1">
        <a-video src="#vid_p4_5" chromakey="videoSelector: #vid_p4_5; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p6_7" mindar-image-target="targetIndex: 2">
        <a-video src="#vid_p6_7" chromakey="videoSelector: #vid_p6_7; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p8_9" mindar-image-target="targetIndex: 3">
        <a-video src="#vid_p8_9" chromakey="videoSelector: #vid_p8_9; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p10_11" mindar-image-target="targetIndex: 4">
        <a-video src="#vid_p10_11" chromakey="videoSelector: #vid_p10_11; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p12_13" mindar-image-target="targetIndex: 5">
        <a-video src="#vid_p12_13" chromakey="videoSelector: #vid_p12_13; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p14_15" mindar-image-target="targetIndex: 6">
        <a-video src="#vid_p14_15" chromakey="videoSelector: #vid_p14_15; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p16_17" mindar-image-target="targetIndex: 7">
        <a-video src="#vid_p16_17" chromakey="videoSelector: #vid_p16_17; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p18_19" mindar-image-target="targetIndex: 8">
        <a-video src="#vid_p18_19" chromakey="videoSelector: #vid_p18_19; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p20_21" mindar-image-target="targetIndex: 9">
        <a-video src="#vid_p20_21" chromakey="videoSelector: #vid_p20_21; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p22_23" mindar-image-target="targetIndex: 10">
        <a-video src="#vid_p22_23" chromakey="videoSelector: #vid_p22_23; color: #00FF00" position="0 0 0" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

    </a-scene>

    <!-- Unobtrusive fallback control shown only if autoplay is blocked -->
    <button id="enableSound" aria-hidden="true">Ton aktivieren</button>

    <script>
      (function () {
        const loopDuration = 4.0; // seconds

        const mainAudio = document.getElementById('mainAudio');
        const enableSoundBtn = document.getElementById('enableSound');

        // Map targets to videos
        const mappings = [
          { targetId: 'target_p1', videoId: 'vid_p1' },
          { targetId: 'target_p4_5', videoId: 'vid_p4_5' },
          { targetId: 'target_p6_7', videoId: 'vid_p6_7' },
          { targetId: 'target_p8_9', videoId: 'vid_p8_9' },
          { targetId: 'target_p10_11', videoId: 'vid_p10_11' },
          { targetId: 'target_p12_13', videoId: 'vid_p12_13' },
          { targetId: 'target_p14_15', videoId: 'vid_p14_15' },
          { targetId: 'target_p16_17', videoId: 'vid_p16_17' },
          { targetId: 'target_p18_19', videoId: 'vid_p18_19' },
          { targetId: 'target_p20_21', videoId: 'vid_p20_21' },
          { targetId: 'target_p22_23', videoId: 'vid_p22_23' }
        ];

        // Ensure mainAudio config
        mainAudio.loop = true;
        mainAudio.preload = 'auto';
        mainAudio.crossOrigin = "anonymous";
        // initially muted until we attempt to play on targetFound (prevents unexpected audio)
        // but we will unmute when actually starting play
        mainAudio.muted = true;

        // Start MindAR as soon as possible to request camera access
        async function startMindAROnLoad() {
          const scene = document.querySelector('a-scene');
          if (!scene) return;

          // Find MindAR component/system
          let mindarComp = null;
          if (scene.components && scene.components['mindar-image']) mindarComp = scene.components['mindar-image'];
          else if (scene.systems && scene.systems['mindar-image']) mindarComp = scene.systems['mindar-image'];
          else if (scene.components && scene.components['mindar-image-system']) mindarComp = scene.components['mindar-image-system'];

          if (!mindarComp || typeof mindarComp.start !== 'function') {
            console.error('MindAR component not found or has no start() — check that mindar script loaded.');
            return;
          }

          try {
            await mindarComp.start(); // this should open the camera permission prompt
            attachTargetListeners();
          } catch (err) {
            console.error('Error starting MindAR:', err);
          }
        }

        function attachTargetListeners() {
          mappings.forEach(map => {
            const targetEl = document.getElementById(map.targetId);
            const videoEl = document.getElementById(map.videoId);
            if (!targetEl || !videoEl) return;

            // make sure video paused lazy
            try { videoEl.pause(); } catch (e) {}

            targetEl.addEventListener('targetFound', async () => {
              // On ANY target found: sync its video to current mainAudio beat
              try {
                const cur = (mainAudio.currentTime && !isNaN(mainAudio.currentTime)) ? mainAudio.currentTime : 0;
                videoEl.currentTime = cur % loopDuration;
              } catch (e) {
                console.warn('Could not set video currentTime', e);
              }

              // Play the video (muted) — this should be allowed
              const vp = videoEl.play();
              if (vp && vp.catch) vp.catch(err => console.warn('video.play() failed', err));

              // Special behaviour: when page 4_5 (target_p4_5) is found -> start mainAudio audible
              if (map.targetId === 'target_p4_5') {
                try {
                  // Unmute then attempt play
                  mainAudio.muted = false;
                  const ap = mainAudio.play();
                  if (ap && ap.catch) {
                    ap.catch(err => {
                      console.warn('mainAudio.play() blocked:', err);
                      // show small enable sound button for user gesture
                      showEnableSound();
                      // keep audio muted for now (user likely hearing CD)
                      mainAudio.muted = true;
                    });
                  }
                } catch (e) {
                  console.warn('Error while attempting to play mainAudio:', e);
                  showEnableSound();
                }
              }
            });

            targetEl.addEventListener('targetLost', () => {
              try { videoEl.pause(); } catch (e) {}
            });
          });
        }

        function showEnableSound() {
          enableSoundBtn.setAttribute('aria-hidden', 'false');
          enableSoundBtn.style.display = 'inline-block';
        }

        function hideEnableSound() {
          enableSoundBtn.setAttribute('aria-hidden', 'true');
          enableSoundBtn.style.display = 'none';
        }

        enableSoundBtn.addEventListener('click', async () => {
          try {
            mainAudio.muted = false;
            await mainAudio.play();
            hideEnableSound();
          } catch (e) {
            console.warn('User-initiated mainAudio.play() failed', e);
          }
        });

        // Pause videos on page hide to free memory
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            mappings.forEach(m => {
              const v = document.getElementById(m.videoId);
              if (v && !v.paused) try { v.pause(); } catch (e) {}
            });
          }
        });

        // Expose useful debug API
        window.__ARC = { startMindAROnLoad, mappings, loopDuration };

        // Start MindAR as early as possible after load.
        // We wait for 'load' to allow all assets to register.
        window.addEventListener('load', () => {
          // Small timeout to ensure mindar component is registered in scene
          setTimeout(startMindAROnLoad, 100);
        });
      })();
    </script>
  </body>
</html>

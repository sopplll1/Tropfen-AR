<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>AR Comic — index</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Swanky+and+Moo+Moo&display=swap" rel="stylesheet">

    <!-- A-Frame (stabile Version) -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

    <!-- MindAR core + A-Frame integration (stabile Version) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,body { height:100%; margin:0; background:#000; font-family: 'Swanky and Moo Moo', cursive; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
      a-scene { position: absolute; inset: 0; width:100%; height:100%; }

      /* Very small fallback control shown only if autoplay is blocked */
      #enableSound {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 5vh;
        z-index: 9999;
        display: none;
        background: rgba(42,55,106,0.95);
        color: #fff;
        border: none;
        padding: 10px 18px;
        font-size: 15px;
        border-radius: 12px;
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(0,0,0,0);
      }
      #enableSound[aria-hidden="false"] { display: inline-block; }

      /* Force MindAR camera video fullscreen (debug/fix for small preview) */
      video:not([src]), video[src=""] {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        transform: none !important;
        margin: 0 !important;
        z-index: 0 !important;
      }
      a-scene { z-index: 1; }
      a-scene canvas { position: absolute; left: 0; top: 0; width: 100% !important; height: 100% !important; z-index: 1 !important; }

      /* Loader / fallback overlay when video takes too long */
      #arLoader {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        pointer-events: none;
      }
      #arLoader.show { display: flex; pointer-events: auto; }
      #arLoader .box { background: rgba(0,0,0,0.6); color: #fff; padding: 18px 22px; border-radius: 12px; font-size: 16px; }

      /* Visible debug button for quick unmute (made larger than before) */
      #enableSound.debug-visible {
        bottom: 50%; transform: translate(-50%, 50%); font-size: 18px; padding: 14px 22px;
      }
    </style>

    <script>
      // Chromakey shader component (robust, wrapped in try/catch so it won't break the page)
      (function(){
        if (!window.AFRAME) {
          console.warn('AFRAME not found when defining chromakey component');
          return;
        }

        try {
          AFRAME.registerComponent('chromakey', {
            schema: {
              color: { type: 'color', default: '#00FF00' },
              videoSelector: { type: 'selector', default: null }
            },
            init: function () {
              const el = this.el;
              const self = this;

              const attach = () => {
                try {
                  let videoEl = self.data.videoSelector;
                  if (!videoEl) {
                    const srcAttr = el.getAttribute('src');
                    if (srcAttr && typeof srcAttr === 'string' && srcAttr.startsWith('#')) {
                      videoEl = document.querySelector(srcAttr);
                    }
                  }
                  if (!videoEl) return;

                  // Create video texture
                  if (!window.THREE) {
                    console.warn('THREE not available yet, retrying attach');
                    setTimeout(attach, 200);
                    return;
                  }

                  const videoTexture = new THREE.VideoTexture(videoEl);
                  videoTexture.minFilter = THREE.LinearFilter;
                  videoTexture.magFilter = THREE.LinearFilter;
                  videoTexture.format = THREE.RGBFormat;

                  const mesh = el.getObject3D('mesh');
                  if (!mesh) {
                    // a-video may not have created its mesh yet — retry shortly
                    setTimeout(attach, 200);
                    return;
                  }

                  mesh.material = new THREE.ShaderMaterial({
                    uniforms: {
                      texture1: { value: videoTexture },
                      keyColor: { value: new THREE.Color(self.data.color) },
                      threshold: { value: 0.35 },
                      softness: { value: 0.08 },
                      spillSuppress: { value: 0.85 }
                    },
                    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
                    fragmentShader: `precision mediump float;
varying vec2 vUv;
uniform sampler2D texture1;
uniform vec3 keyColor;
uniform float threshold;
uniform float softness;
uniform float spillSuppress;
void main() {
  vec4 tex = texture2D(texture1, vUv);
  float d = distance(tex.rgb, keyColor);
  float alpha = smoothstep(threshold - softness, threshold + softness, d);
  float avg = (tex.r + tex.g + tex.b) / 3.0;
  float suppressedG = mix(tex.g, avg, spillSuppress * (1.0 - alpha));
  vec3 finalColor = vec3(tex.r, suppressedG, tex.b);
  gl_FragColor = vec4(finalColor, alpha);
}`,
                    transparent: true,
                    depthTest: true,
                    side: THREE.DoubleSide
                  });

                  // reduce z-fighting: draw on top and disable depthTest if desired
                  try {
                    mesh.renderOrder = 999;
                    mesh.material.depthTest = false;
                  } catch (e) { /* ignore */ }

                  // Keep reference so texture updates continue
                  if (mesh.material && mesh.material.uniforms) mesh.material.uniforms.texture1.value = videoTexture;
                } catch (err) {
                  console.error('chromakey attach error', err);
                }
              };

              try {
                if (el.getObject3D && el.getObject3D('mesh')) attach();
                else {
                  el.addEventListener('loaded', attach);
                  setTimeout(attach, 300);
                }
              } catch (e) {
                console.error('chromakey init error', e);
              }
            }
          });
        } catch (e) {
          console.error('Failed to register chromakey component', e);
        }
      })();
    </script>
  </head>

  <body>
    <!-- MindAR scene: ui* enabled so native scanning UI appears for the user -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: true; uiScanning: true; uiError: true; uiTarget: true"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: false"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <!-- Master audio (metronome/song). Will be started when page 4_5 is scanned -->
        <audio id="mainAudio" src="./assets/Kompletter_song.mp3" crossorigin="anonymous" preload="auto" loop></audio>

        <!-- All videos lazy-loaded; first pages primed with preload auto -->
        <video id="vid_p1" src="./assets/Page_1.mp4" loop playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
        <video id="vid_p4_5" src="./assets/Page_4_5.mp4" loop playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
        <video id="vid_p6_7" src="./assets/Page_6_7.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p8_9" src="./assets/Page_8_9.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p10_11" src="./assets/Page_10_11.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p12_13" src="./assets/Page_12_13.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p14_15" src="./assets/Page_14_15.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p16_17" src="./assets/Page_16_17.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p18_19" src="./assets/Page_18_19.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p20_21" src="./assets/Page_20_21.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
        <video id="vid_p22_23" src="./assets/Page_22_23.mp4" loop playsinline webkit-playsinline muted preload="none" crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Targets: each a-entity with mindar-image-target that contains a single a-video -->
      <a-entity id="target_p1" mindar-image-target="targetIndex: 0">
        <a-video src="#vid_p1" chromakey="videoSelector: #vid_p1; color: #00FF00" position="0 0 0.001" height="1" width="1" scale="1.16 1.16 1.16"></a-video>
      </a-entity>

      <a-entity id="target_p4_5" mindar-image-target="targetIndex: 1">
        <a-video src="#vid_p4_5" chromakey="videoSelector: #vid_p4_5; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p6_7" mindar-image-target="targetIndex: 2">
        <a-video src="#vid_p6_7" chromakey="videoSelector: #vid_p6_7; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p8_9" mindar-image-target="targetIndex: 3">
        <a-video src="#vid_p8_9" chromakey="videoSelector: #vid_p8_9; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p10_11" mindar-image-target="targetIndex: 4">
        <a-video src="#vid_p10_11" chromakey="videoSelector: #vid_p10_11; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p12_13" mindar-image-target="targetIndex: 5">
        <a-video src="#vid_p12_13" chromakey="videoSelector: #vid_p12_13; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p14_15" mindar-image-target="targetIndex: 6">
        <a-video src="#vid_p14_15" chromakey="videoSelector: #vid_p14_15; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p16_17" mindar-image-target="targetIndex: 7">
        <a-video src="#vid_p16_17" chromakey="videoSelector: #vid_p16_17; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p18_19" mindar-image-target="targetIndex: 8">
        <a-video src="#vid_p18_19" chromakey="videoSelector: #vid_p18_19; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p20_21" mindar-image-target="targetIndex: 9">
        <a-video src="#vid_p20_21" chromakey="videoSelector: #vid_p20_21; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>

      <a-entity id="target_p22_23" mindar-image-target="targetIndex: 10">
        <a-video src="#vid_p22_23" chromakey="videoSelector: #vid_p22_23; color: #00FF00" position="0 0 0.001" height="0.6" width="1.2" scale="1.2 1.2 1.2"></a-video>
      </a-entity>
    </a-scene>

    <!-- Fallback button only shown if autoplay blocked -->
    <button id="enableSound" aria-hidden="true">Ton aktivieren</button>

    <!-- Loader overlay -->
    <div id="arLoader"><div class="box">Lädt AR-Inhalt…</div></div>

    <script>
      (function () {
        const loopDuration = 4.0; // seconds (video loop length) - adjust per video if needed
        const mainAudio = document.getElementById('mainAudio');
        const enableSoundBtn = document.getElementById('enableSound');
        const arLoader = document.getElementById('arLoader');

        // Map target IDs to their video IDs
        const mappings = [
          { targetId: 'target_p1', videoId: 'vid_p1', critical: true, loopDuration: 4.0 },
          { targetId: 'target_p4_5', videoId: 'vid_p4_5', critical: true, loopDuration: 4.0 },
          { targetId: 'target_p6_7', videoId: 'vid_p6_7', critical: false, loopDuration: 4.0 },
          { targetId: 'target_p8_9', videoId: 'vid_p8_9', critical: false, loopDuration: 4.0 },
          { targetId: 'target_p10_11', videoId: 'vid_p10_11', critical: false, loopDuration: 4.0 },
          { targetId: 'target_p12_13', videoId: 'vid_p12_13', critical: false, loopDuration: 4.0 },
          { targetId: 'target_p14_15', videoId: 'vid_p14_15', critical: false, loopDuration: 4.0 },
          { targetId: 'target_p16_17', videoId: 'vid_p16_17', critical: false, loopDuration: 4.0 },
          { targetId: 'target_p18_19', videoId: 'vid_p18_19', critical: false, loopDuration: 4.0 },
          { targetId: 'target_p20_21', videoId: 'vid_p20_21', critical: false, loopDuration: 4.0 },
          { targetId: 'target_p22_23', videoId: 'vid_p22_23', critical: false, loopDuration: 4.0 }
        ];

        // Configure mainAudio for autoplay attempts
        if (mainAudio) {
          mainAudio.loop = true;
          mainAudio.preload = 'auto';
          mainAudio.crossOrigin = "anonymous";
          mainAudio.muted = true; // start muted to allow autoplay attempt where possible
        }

        // Utility to show fallback button
        function showEnableSound(debug) {
          if (!enableSoundBtn) return;
          enableSoundBtn.setAttribute('aria-hidden', 'false');
          enableSoundBtn.style.display = 'inline-block';
          if (debug) enableSoundBtn.classList.add('debug-visible');
        }
        function hideEnableSound() {
          if (!enableSoundBtn) return;
          enableSoundBtn.setAttribute('aria-hidden', 'true');
          enableSoundBtn.style.display = 'none';
          enableSoundBtn.classList.remove('debug-visible');
        }

        function showLoader() { if (arLoader) arLoader.classList.add('show'); }
        function hideLoader() { if (arLoader) arLoader.classList.remove('show'); }

        // Helper: wait until a video has metadata / frames available (canplay) with timeout
        function ensureVideoReady(v, timeout=4000) {
          return new Promise(res => {
            if (!v) return res(false);
            if (v.readyState >= 3) return res(true); // HAVE_FUTURE_DATA / canplaythrough
            let done = false;
            const ok = () => { if (done) return; done = true; clearTimeout(t); res(true); };
            v.addEventListener('canplay', ok, { once: true });
            v.addEventListener('canplaythrough', ok, { once: true });
            const t = setTimeout(()=>{ if (!done) { done = true; res(false); } }, timeout);
          });
        }

        // Prime critical videos to reduce first-frame latency
        function primeCriticalVideos() {
          mappings.filter(m => m.critical).forEach(m => {
            const v = document.getElementById(m.videoId);
            if (!v) return;
            try {
              v.preload = 'auto';
              v.playsInline = true;
              v.setAttribute('webkit-playsinline', '');
              v.muted = true;
              v.load();
              v.addEventListener('loadeddata', () => {
                // quick play/pause to warm decoder
                v.play().then(()=>{ v.pause(); v.currentTime = 0; }).catch(()=>{});
              }, { once: true });
            } catch (e) { /* ignore */ }
          });
        }

        // Sync controller to keep video in time with audio master
        function createSyncController(videoEl, loopDuration, audioEl) {
          let rafId = null;
          const maxHardSync = 0.12; // seconds - larger -> hard seek
          const resyncGain = 0.35;  // playbackRate correction strength

          function step() {
            if (!videoEl || videoEl.paused || !audioEl) { rafId = requestAnimationFrame(step); return; }
            const audioTime = audioEl.currentTime || 0;
            const audioPos = audioTime % loopDuration;
            const videoPos = videoEl.currentTime % loopDuration;
            let delta = audioPos - videoPos;
            if (delta > loopDuration / 2) delta -= loopDuration;
            if (delta < -loopDuration / 2) delta += loopDuration;

            if (Math.abs(delta) > maxHardSync) {
              try { videoEl.currentTime = audioPos; videoEl.play().catch(()=>{}); } catch (e) {}
            } else {
              const adj = 1 + delta * resyncGain;
              const pr = Math.max(0.93, Math.min(1.07, adj));
              videoEl.playbackRate = pr;
            }
            rafId = requestAnimationFrame(step);
          }

          return {
            start() { if (!rafId) rafId = requestAnimationFrame(step); },
            stop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
          };
        }

        // Adapt an a-video entity to its underlying video element aspect ratio
        function adaptVideoToTarget(videoEl, aVideoEntity, maxWidth = 1.0) {
          if (!videoEl || !aVideoEntity) return;
          if (videoEl.readyState < 1) {
            videoEl.addEventListener('loadedmetadata', () => adaptVideoToTarget(videoEl, aVideoEntity, maxWidth), { once: true });
            return;
          }
          const vw = videoEl.videoWidth || videoEl.width || 1;
          const vh = videoEl.videoHeight || videoEl.height || 1;
          const aspect = vw / vh;
          const width = maxWidth;
          const height = width / aspect;
          try {
            aVideoEntity.setAttribute('width', width);
            aVideoEntity.setAttribute('height', height);
            aVideoEntity.setAttribute('position', '0 0 0.001');
            aVideoEntity.setAttribute('scale', '1 1 1');
          } catch (e) { console.warn('adaptVideoToTarget failed', e); }
        }

        // Try to start MindAR robustly after scene load to trigger camera permission
        async function startMindAROnLoad() {
          const scene = document.querySelector('a-scene');
          if (!scene) { console.error('a-scene not found'); return; }

          // Prime critical videos before starting camera/tracking
          primeCriticalVideos();

          // Wait until scene is loaded
          await new Promise(res => { if (scene.hasLoaded) res(); else scene.addEventListener('loaded', res); });

          // Search for an object with a start() function
          let mindar = null;
          const keys = [...Object.keys(scene.systems || {}), ...Object.keys(scene.components || {})];
          for (const k of keys) {
            const obj = (scene.systems && scene.systems[k]) || (scene.components && scene.components[k]);
            if (obj && typeof obj.start === 'function') { mindar = obj; break; }
          }

          if (!mindar) { console.error('MindAR system with start() not found'); return; }

          try {
            await mindar.start(); // triggers camera permission prompt
            console.log('MindAR started (camera prompt shown / tracking active).');
            attachTargetListeners();
          } catch (err) {
            console.error('Error starting MindAR:', err);
          }
        }

        function attachTargetListeners() {
          mappings.forEach(map => {
            const targetEl = document.getElementById(map.targetId);
            const videoEl = document.getElementById(map.videoId);
            const aVideoEntity = document.querySelector(`#${map.targetId} a-video`);
            if (!targetEl || !videoEl || !aVideoEntity) return;

            // adapt visual size to the video's aspect
            adaptVideoToTarget(videoEl, aVideoEntity, map.maxWidth || 1.0);

            // Ensure video is paused/lazy
            try { videoEl.pause(); } catch(e){}

            // When any target is found -> sync that target's video to mainAudio beat and play
            targetEl.addEventListener('targetFound', async () => {
              console.log('DEBUG: targetFound', map.targetId);
              showLoader();
              try {
                const ready = await ensureVideoReady(videoEl, 4000);
                const cur = (mainAudio && mainAudio.currentTime && !isNaN(mainAudio.currentTime)) ? mainAudio.currentTime : 0;
                const audioPos = cur % (map.loopDuration || loopDuration);
                if (!ready) console.warn('Video not ready quickly for', map.videoId);
                try { videoEl.currentTime = audioPos; } catch(e) { console.warn('Could not set video currentTime', e); }
                videoEl.playbackRate = 1;
                try { const p = videoEl.play(); if (p && p.catch) p.catch(err => console.warn('video.play() failed', err)); } catch (e) {}

                // start sync controller
                if (!videoEl.__sync) videoEl.__sync = createSyncController(videoEl, map.loopDuration || loopDuration, mainAudio);
                videoEl.__sync.start();
              } catch (e) {
                console.warn('Error during targetFound handling', e);
              } finally { hideLoader(); }

              // If this is page 4_5, start/unmute mainAudio
              if (map.targetId === 'target_p4_5' && mainAudio) {
                try {
                  // First attempt: unmute and play
                  mainAudio.muted = false;
                  const ap = mainAudio.play();
                  if (ap && ap.catch) {
                    ap.catch(err => {
                      console.warn('Autoplay blocked for mainAudio:', err);
                      (async () => {
                        try {
                          mainAudio.muted = true;
                          await mainAudio.play();
                          showEnableSound(true);
                        } catch (e) {
                          console.warn('Playing muted mainAudio also failed:', e);
                          showEnableSound(true);
                        }
                      })();
                    });
                  }
                } catch (e) {
                  console.warn('Error while attempting to start mainAudio:', e);
                  showEnableSound(true);
                }
              }
            });

            targetEl.addEventListener('targetLost', () => {
              try {
                if (videoEl.__sync) { videoEl.__sync.stop(); }
                videoEl.pause();
              } catch(e){}
            });
          });
        }

        // Fallback user gesture to enable sound if autoplay blocked
        if (enableSoundBtn) enableSoundBtn.addEventListener('click', async () => {
          try {
            if (mainAudio) mainAudio.muted = false;
            if (mainAudio) await mainAudio.play();
            hideEnableSound();
          } catch (e) {
            console.warn('User-initiated mainAudio.play() failed', e);
          }
        });

        // Pause all videos when page hidden to free memory
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            mappings.forEach(m => {
              const v = document.getElementById(m.videoId);
              if (v && !v.paused) try { v.pause(); } catch(e){}
            });
          }
        });

        // Debug hook
        window.__ARC = { startMindAROnLoad, mappings, loopDuration };

        // Start MindAR as early as possible after load. Small delay so mindar component registers.
        window.addEventListener('load', () => {
          setTimeout(startMindAROnLoad, 80);
        });
      })();
    </script>
  </body>
</html>
